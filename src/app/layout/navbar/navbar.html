<header class="sticky top-0 z-50 border-b border-(--app-border-subtle) bg-(--app-bg)/85 backdrop-blur">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-x-8 gap-y-4 px-6 py-5">
    <!-- Nom de la cave (pas de logo officiel) -->
    <a routerLink="/" class="font-display text-xl leading-tight text-(--p-text-color) no-underline">
      Les amis du bon Bourgogne
    </a>

    <!-- Menu -->
    <nav class="flex items-center gap-8 text-xs font-semibold tracking-[0.2em] uppercase">
      <a routerLink="/" routerLinkActive="nav-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">Accueil</a>
      <a routerLink="/carte" routerLinkActive="nav-active" class="nav-link">Notre sélection</a>
      <!-- Le footer (#contact) est sur toutes les pages : on y défile sans changer de page -->
      <a href="#contact" (click)="scrollToContact($event)" class="nav-link">Contact</a>
    </nav>

    <!-- Actions -->
    <div class="flex items-center gap-3">
      <button type="button" class="icon-btn" (click)="theme.toggle()"
              [attr.aria-label]="theme.mode() === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre'">
        @if (theme.mode() === 'dark') {
          <!-- Soleil -->
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        } @else {
          <!-- Lune -->
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        }
      </button>
      <a href="mailto:info@amisdubonbourgogne.eu" class="cta-outline">Nous écrire <span aria-hidden="true">→</span></a>
    </div>
  </div>
</header>
