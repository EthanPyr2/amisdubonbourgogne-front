<header class="sticky top-0 z-50 border-b border-(--app-border-subtle) bg-(--app-bg)/85 backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-x-8 px-6 py-5">
    <a routerLink="/" class="font-display text-xl leading-tight text-(--p-text-color) no-underline">
      Les amis du bon Bourgogne
    </a>

    <nav class="hidden items-center gap-8 text-xs font-semibold tracking-[0.2em] uppercase lg:flex" aria-label="Navigation principale">
      <a routerLink="/" routerLinkActive="nav-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">Accueil</a>
      <a routerLink="/carte" routerLinkActive="nav-active" class="nav-link">Notre sélection</a>
      <a href="#contact" (click)="scrollToContact($event)" class="nav-link">Contact</a>
    </nav>

    <div class="flex items-center gap-3">
      <button type="button" class="icon-btn" (click)="theme.toggle()"
              [attr.aria-label]="theme.mode() === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre'">
        @if (theme.mode() === 'dark') {
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        } @else {
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        }
      </button>
      <a href="mailto:info@amisdubonbourgogne.eu" class="cta-outline desktop-only">Nous écrire <span aria-hidden="true">→</span></a>

      <button type="button" class="icon-btn burger" [class.is-open]="menuOpen()" (click)="toggleMenu()"
              aria-controls="menu-mobile" [attr.aria-expanded]="menuOpen()"
              [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav id="menu-mobile" class="mobile-menu" aria-label="Navigation principale">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Accueil</a>
      <a routerLink="/carte" routerLinkActive="is-active" (click)="closeMenu()">Notre sélection</a>
      <a href="#contact" (click)="scrollToContact($event)">Contact</a>
      <a href="mailto:info@amisdubonbourgogne.eu" class="cta-outline mt-4 justify-center" (click)="closeMenu()">
        Nous écrire <span aria-hidden="true">→</span>
      </a>
    </nav>
  }
</header>
